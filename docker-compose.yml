services:
  yt-fast-api:
    build: .
    container_name: yt-fast-api
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      API_KEY: ${API_KEY}
      COOKIE_FILE: /app/cookies.txt
      COOKIE_URL: ${COOKIE_URL:-}
      SEARCH_CACHE_TTL: ${SEARCH_CACHE_TTL:-300}
      SONG_CACHE_TTL: ${SONG_CACHE_TTL:-180}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-20}
      MAX_WORKERS: ${MAX_WORKERS:-4}
    volumes:
      - ./cookies.txt:/app/cookies.txt
